name: Guidance integrity workbench

on:
  push:
    branches: [codex/guidance-delivery-integrity]
    paths: [.github/workflows/guidance-integrity-workbench.yml]

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      GUIDANCE_PATCH: >-
        
        
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-verified correction
        run: |
          python - <<'PY'
          import os,base64,lzma,hashlib,subprocess
          patch=lzma.decompress(base64.b64decode(os.environ['GUIDANCE_PATCH']))
          assert hashlib.sha256(patch).hexdigest() == 'ddb4c3213188dfd6ea78ee9eb138956227d262563643b4b8677cb89b1c75c8e9'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
          git diff --check
      - name: Install Python dependencies
        run: pip install -r web-app/requirements.txt
      - name: Compile and run complete web-app suite
        run: |
          mkdir -p /tmp/guidance-qa
          python -m compileall -q web-app
          python -m unittest discover -s web-app/tests -p 'test_*.py' 2>&1 | tee /tmp/guidance-qa/unit-tests.log
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated browser harness
        run: |
          python web-app/tests/sales_coaching_browser_harness.py > /tmp/guidance-qa/harness.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5065/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/guidance-qa/harness.log
          exit 1
      - name: Guidance and delivery browser regressions
        env:
          GUIDANCE_SCREENSHOT_DIR: /tmp/guidance-qa/screenshots
        run: node web-app/tests/guidance_integrity_browser_smoke.cjs 2>&1 | tee /tmp/guidance-qa/browser-tests.log
      - name: Publish verified application changes to this development branch only
        run: |
          git restore .github/workflows/sales-coaching.yml
          git add docs/guidance-delivery-integrity.md web-app/app.py web-app/index.html web-app/priority.py web-app/tests/guidance_integrity_browser_smoke.cjs web-app/tests/guidance_integrity_frontend.cjs web-app/tests/test_final_correction_release.py web-app/tests/test_guidance_integrity.py web-app/tests/test_guidance_integrity_frontend.py web-app/tests/test_planning_suggestions_v3.py web-app/tests/test_priority_v2.py web-app/tests/test_priority_v3.py web-app/tests/test_priority_v4.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct trigger explanations and pair DFP with delivery dates'
          git push origin HEAD:codex/guidance-delivery-integrity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guidance-integrity-qa
          path: /tmp/guidance-qa
          retention-days: 3
