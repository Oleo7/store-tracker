name: PR48 isolated source audit
on:
  push:
    branches: [audit/pr48-history-20261019]
    paths: [.github/workflows/pr48-source-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download browser driver packages only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr48-browser"
          npm pack playwright@1.55.0 --pack-destination "$RUNNER_TEMP/pr48-browser"
          npm pack playwright-core@1.55.0 --pack-destination "$RUNNER_TEMP/pr48-browser"
          sha256sum "$RUNNER_TEMP/pr48-browser/"*
      - uses: actions/upload-artifact@v4
        with:
          name: pr48-browser-inputs
          path: ${{ runner.temp }}/pr48-browser/
          retention-days: 1
          if-no-files-found: error
