name: Publish independently verified PR48 candidate
on:
  push:
    branches: [audit/pr48-history-20261019]
    paths: [.github/workflows/pr48-source-audit.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 578c906a2a215c6aaec303128c241819428c413e
          fetch-depth: 0
          path: source
      - name: Require successful tests from the exact verified candidate tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Oleo7/store-tracker/actions/runs/39209973913/jobs > "$RUNNER_TEMP/verified-jobs.json"
          python - <<'PY'
          import json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/verified-jobs.json'))
          steps={s['name']:s for j in data['jobs'] for s in j['steps']}
          required=['Apply checksum-verified source-only patch','Compile and run all unit and frontend contract tests','Desktop browser smoke','Mobile browser smoke','Guidance and delivery browser regressions','Priority and commitment browser regressions','Calendar mouse and touch regressions']
          assert all(steps[n]['conclusion']=='success' for n in required), 'Missing successful source/test verification'
          print('All seven source and test verification steps succeeded. Prior publication alone failed because browser screenshots are tracked outputs.')
          PY
      - name: Reconstruct and publish checksum-identical verified source only
        shell: bash
        run: |
          set -euo pipefail
          cat transport/.audit/pr48-fix.{1,2,3,4}.b64 | base64 --decode | xz --decompress > "$RUNNER_TEMP/source.patch"
          echo "846f54d49731fa7d5af0a2a078781a47970a26291ab72f8e57b94ca73d41728e  $RUNNER_TEMP/source.patch" | sha256sum --check
          cd source
          git apply --index --unidiff-zero "$RUNNER_TEMP/source.patch"
          git apply --index --unidiff-zero ../transport/.audit/browser-readiness.patch
          git diff --cached --check
          test "$(git write-tree)" = c2bd0988c3b361951004b0661201e8fe8b9caef9
          git -c user.name='Polarbear verification' -c user.email='noreply@openai.com' commit -m 'fix(priority): reconcile history, preserve promises and align route objectives'
          git diff --exit-code HEAD --
          git push origin HEAD:refs/heads/audit/pr48-candidate-20261019
          mkdir -p verification
          git rev-parse HEAD > verification/candidate-sha.txt
          git rev-parse HEAD^{tree} > verification/candidate-tree.txt
          git bundle create verification/candidate.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pr48-verified-candidate-source
          path: source/verification/
          retention-days: 2
          if-no-files-found: error
