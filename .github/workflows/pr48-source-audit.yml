name: PR48 isolated source audit
on:
  push:
    branches: [audit/pr48-history-20261019]
    paths: [.github/workflows/pr48-source-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr48-sources"
          git archive --format=tar 578c906a2a215c6aaec303128c241819428c413e > "$RUNNER_TEMP/pr48-sources/pr48-head.tar"
          git archive --format=tar 6b97c4d77b19010ae955cb84f3dbf741fe4a0060 > "$RUNNER_TEMP/pr48-sources/v22-base.tar"
          git ls-tree -r 578c906a2a215c6aaec303128c241819428c413e > "$RUNNER_TEMP/pr48-sources/pr48-tree.txt"
          sha256sum "$RUNNER_TEMP/pr48-sources/"*.tar
      - uses: actions/upload-artifact@v4
        with:
          name: pr48-pinned-source
          path: ${{ runner.temp }}/pr48-sources/
          retention-days: 1
          if-no-files-found: error
